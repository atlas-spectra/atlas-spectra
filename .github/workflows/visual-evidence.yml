name: visual evidence

on:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tests/visual/**"
      - ".github/workflows/visual-evidence.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run test:visual
      - name: Upload explorer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-playwright-diagnostics
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
