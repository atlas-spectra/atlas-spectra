name: publish visual evidence

on:
  workflow_run:
    workflows: ["visual evidence"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-evidence
      - name: Download screenshot artifact
        uses: actions/download-artifact@v5
        with:
          name: explorer-screenshots
          path: evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish screenshots to evidence branch
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          target="pr-${PR_NUMBER}"
          mkdir -p "${target}"
          cp evidence/*.png "${target}/"
          printf '%s\n' "source_sha=${SOURCE_SHA}" > "${target}/source.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          if ! git diff --cached --quiet; then
            git commit -m "docs(visual): publish PR #${PR_NUMBER} screenshots"
            git push origin visual-evidence
          fi
