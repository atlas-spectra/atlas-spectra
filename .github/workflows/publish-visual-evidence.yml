name: publish visual evidence

on:
  workflow_run:
    workflows: ["visual evidence"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-evidence
      - name: Download screenshot artifact
        uses: actions/download-artifact@v5
        with:
          name: explorer-screenshots
          path: evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish screenshots to evidence branch
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          target="pr-${PR_NUMBER}"
          mkdir -p "${target}"
          cp evidence/*.png "${target}/"
          printf '%s\n' "source_sha=${SOURCE_SHA}" > "${target}/source.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          if ! git diff --cached --quiet; then
            git commit -m "docs(visual): publish PR #${PR_NUMBER} screenshots"
            git push origin visual-evidence
          fi
      - name: Embed screenshots in PR
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0].number;
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/visual-evidence/pr-${pr}`;
            const marker = '<!-- atlas-spectra-visual-evidence -->';
            const body = `${marker}\n## Visual review\nGenerated from \`${sha.slice(0, 12)}\`.\n\n### Explorer overview\n![Explorer overview](${base}/explorer-overview.png?v=${sha})\n\n### Hover / floating label\n![Explorer hover label](${base}/explorer-hover-label.png?v=${sha})\n\n### Fit-all bounds\n![Explorer fit all](${base}/explorer-fit-all.png?v=${sha})\n\n### Mobile\n![Explorer mobile](${base}/explorer-mobile.png?v=${sha})`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
