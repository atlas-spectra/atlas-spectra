name: web

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".nvmrc"
      - "examples/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".nvmrc"
      - "examples/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
