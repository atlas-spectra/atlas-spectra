name: web

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".nvmrc"
      - "examples/**"
      - "schema/**"
      - "scripts/validate-schema.py"
      - "scripts/validate-corpus.py"
      - "tests/**"
      - "requirements-schema.txt"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".nvmrc"
      - "examples/**"
      - "schema/**"
      - "scripts/validate-schema.py"
      - "scripts/validate-corpus.py"
      - "tests/**"
      - "requirements-schema.txt"
      - ".github/workflows/web.yml"

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-schema.txt
      - name: Validate scientific corpus
        run: |
          pip install -r requirements-schema.txt
          python scripts/validate-schema.py
          python scripts/validate-corpus.py
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
