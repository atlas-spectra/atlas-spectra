name: prepare flight dependencies

on:
  push:
    branches: [feat/frequency-flight]
    paths: [.github/workflows/bootstrap-flight-dependencies.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/frequency-flight
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Lock the reviewed 3D dependency set
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund three@0.180.0 @react-three/fiber@9.3.0
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund @types/three@0.180.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/bootstrap-flight-dependencies.yml
          git commit -m 'build(web): lock Three.js and React Three Fiber'
          git push origin HEAD:feat/frequency-flight
