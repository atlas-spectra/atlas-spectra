name: refresh PR 18 visual evidence

on:
  push:
    branches: [feat/explorer-visual-review]
    paths:
      - ".github/workflows/bootstrap-pr18-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-evidence
      - name: Download passing screenshot artifact
        uses: actions/download-artifact@v5
        with:
          name: explorer-screenshots
          path: evidence
          run-id: 33712150000
          github-token: ${{ github.token }}
      - name: Refresh PR 18 screenshots
        env:
          SOURCE_SHA: ddbe64ab6ac1bbe967dcf88207909856f744c888
        run: |
          mkdir -p pr-18
          rm -f pr-18/*.png
          cp evidence/*.png pr-18/
          printf '%s\n' "source_sha=${SOURCE_SHA}" > pr-18/source.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr-18
          if ! git diff --cached --quiet; then
            git commit -m "docs(visual): refresh PR #18 screenshots"
            git push origin visual-evidence
          fi
