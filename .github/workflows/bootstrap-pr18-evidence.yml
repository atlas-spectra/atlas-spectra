name: bootstrap PR 18 visual evidence

on:
  push:
    branches: [feat/explorer-visual-review]
    paths:
      - ".github/workflows/bootstrap-pr18-evidence.yml"

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-evidence
      - name: Download tested screenshot artifact
        uses: actions/download-artifact@v5
        with:
          name: explorer-screenshots
          path: evidence
          run-id: 33711636260
          github-token: ${{ github.token }}
      - name: Publish PR 18 screenshots
        env:
          SOURCE_SHA: f212aadf5367324af97b2b438fe75f543cd466fe
        run: |
          mkdir -p pr-18
          cp evidence/*.png pr-18/
          printf '%s\n' "source_sha=${SOURCE_SHA}" > pr-18/source.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr-18
          if ! git diff --cached --quiet; then
            git commit -m "docs(visual): publish PR #18 screenshots"
            git push origin visual-evidence
          fi
      - name: Embed screenshots in PR 18
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = 18;
            const sha = 'f212aadf5367324af97b2b438fe75f543cd466fe';
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/visual-evidence/pr-${pr}`;
            const marker = '<!-- atlas-spectra-visual-evidence -->';
            const body = `${marker}\n## Visual review\nGenerated by the passing Chromium visual gate from \`${sha.slice(0, 12)}\`.\n\n### Explorer overview\n![Explorer overview](${base}/explorer-overview.png?v=${sha})\n\n### Hover / floating label\n![Explorer hover label](${base}/explorer-hover-label.png?v=${sha})\n\n### Fit-all bounds\n![Explorer fit all](${base}/explorer-fit-all.png?v=${sha})\n\n### Mobile\n![Explorer mobile](${base}/explorer-mobile.png?v=${sha})`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
