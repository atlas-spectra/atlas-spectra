name: refresh npm lockfile

on:
  push:
    branches: [feat/explorer-visual-review]
    paths:
      - "package.json"
      - ".github/workflows/update-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/explorer-visual-review
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(web): refresh npm lockfile"
            git push origin HEAD:feat/explorer-visual-review
          fi
