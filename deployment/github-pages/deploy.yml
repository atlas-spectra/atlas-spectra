name: Deploy Atlas Spectra root Pages

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Atlas Spectra source ref to deploy
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.client_payload.source_sha || github.event.inputs.source_ref || 'main' }}
    steps:
      - name: Checkout Atlas Spectra source
        uses: actions/checkout@v7
        with:
          repository: atlas-spectra/atlas-spectra
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-schema.txt

      - name: Validate scientific corpus
        run: |
          pip install -r requirements-schema.txt
          python scripts/validate-schema.py
          python scripts/validate-corpus.py
          python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Build Astro site
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
